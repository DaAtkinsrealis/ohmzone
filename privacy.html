<style>
:root{ --bg:#0a1120; --panel:#111a2a; --line:#233350; --ink:#e7edf7; --ink-dim:#8497b8; --trace:#3b9eff; --gold:#e8b545; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.7;}
a{color:var(--trace);}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px;}
@media (max-width:680px){
  .wrap{padding:64px 16px 48px;}
  h1{font-size:21px;}
  h2{font-size:15px;margin:26px 0 8px;}
  p,li{font-size:13.5px;}
  .lang-switch{top:10px;right:10px;padding:2px;}
  .lang-switch button{padding:4px 10px;font-size:10px;}
  .back{font-size:11px;padding:5px 12px;}
}
h1{font-size:26px;margin-bottom:6px;}
.updated{color:var(--ink-dim);font-size:13px;margin-bottom:32px;font-family:'IBM Plex Mono',monospace;}
h2{font-size:17px;color:var(--gold);margin:34px 0 10px;border-bottom:1px solid var(--line);padding-bottom:8px;}
p, li{color:var(--ink-dim);font-size:14.5px;}
ul{padding-left:22px;}
.back{display:inline-block;margin-bottom:24px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:6px 14px;}
.back:hover{color:var(--trace);border-color:var(--trace);}
.lang-switch{display:flex;align-items:center;background:#0f2036;border:1px solid #2f5678;border-radius:16px;padding:3px;gap:2px;font-family:monospace;font-size:11px;position:fixed;top:14px;right:14px;}
.lang-switch button{border:none;background:transparent;color:#8fa8c2;padding:5px 12px;border-radius:13px;cursor:pointer;font-family:inherit;font-size:inherit;}
.lang-switch button.active{background:var(--trace);color:#04120f;font-weight:700;}
code{background:#0d1420;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);}
</style>
</head>
<body>
<div class="lang-switch">
  <button type="button" id="btn-en" class="active" onclick="setLang('en')">EN</button>
  <button type="button" id="btn-fr" onclick="setLang('fr')">FR</button>
</div>
<div class="wrap">
  <a class="back" href="index.html" data-i18n="back">← OhmZone</a>
  <h1 data-i18n="title">Privacy Policy</h1>
  <div class="updated" data-i18n="updated">Last updated: September 2026</div>

  <p data-i18n="intro"></p>

  <h2 data-i18n="h-data-title">What this site collects</h2>
  <p data-i18n="h-data-body"></p>

  <h2 data-i18n="h-ads-title">Advertising and cookies</h2>
  <p data-i18n="h-ads-body"></p>
  <ul>
    <li data-i18n="h-ads-li1"></li>
    <li data-i18n="h-ads-li2"></li>
    <li data-i18n="h-ads-li3"></li>
  </ul>

  <h2 data-i18n="h-children-title">Children's privacy</h2>

  <h2 data-i18n="h-thirdparty-title">Third-party links</h2>
  <p data-i18n="h-thirdparty-body"></p>

  <h2 data-i18n="h-changes-title">Changes to this policy</h2>
  <p data-i18n="h-changes-body"></p>

  <h2 data-i18n="h-contact-title">Contact</h2>
  <p data-i18n="h-contact-body"></p>
</div>

<script>
const translations = {
  en: {
    back: "← OhmZone",
    title: "Privacy Policy",
    updated: "Last updated: September 2026",
    intro: "OhmZone (this site) is a free set of electrical engineering calculation tools. This page explains what happens to your data when you use it.",
    "h-data-title": "What this site collects",
    "h-data-body": "OhmZone has no account system and no server-side backend. The values you type into a calculator — voltages, cable sizes, transformer ratings, project data, and so on — are processed entirely in your own browser and are never sent to, or stored on, any OhmZone server. If a tool offers a \"save project\" feature, that data is stored only in your browser's local storage on your own device; it is not transmitted anywhere. We do not require or collect names, email addresses, or account information to use any calculator on this site.",
    "h-ads-title": "Advertising and cookies",
    "h-ads-body": "This site uses Google AdSense to display advertising. Google and its partners use cookies and similar technologies to serve ads based on your prior visits to this and other websites. This may include personalized advertising, depending on your settings.",
    "h-ads-li1": "You can opt out of personalized advertising by visiting Google's Ads Settings at adssettings.google.com.",
    "h-ads-li2": "You can also opt out of a third-party vendor's use of cookies for personalized advertising by visiting www.aboutads.info.",
    "h-ads-li3": "Google's use of advertising cookies enables it and its partners to serve ads based on your visits to this site and/or other sites on the Internet — see Google's Privacy & Terms at policies.google.com/technologies/ads for details.",
    "h-children-title": "Children's privacy",
    "h-children-body": "This site is intended for professional and educational engineering use and is not directed at children under 13. We do not knowingly collect personal information from children.",
    "h-thirdparty-title": "Third-party links",
    "h-thirdparty-body": "Where this site links to manufacturer datasheets, standards bodies, or other external resources, those sites have their own privacy practices, which we do not control.",
    "h-changes-title": "Changes to this policy",
    "h-changes-body": "This policy may be updated from time to time to reflect changes in how the site works or in applicable advertising/privacy requirements. The \"Last updated\" date above reflects the most recent revision.",
    "h-contact-title": "Contact",
    "h-contact-body": "Questions about this policy can be directed to the site owner via the contact information provided where this site is published or shared."
  },
  fr: {
    back: "← OhmZone",
    title: "Politique de confidentialité",
    updated: "Dernière mise à jour : septembre 2026",
    intro: "OhmZone (ce site) est un ensemble gratuit d'outils de calcul en génie électrique. Cette page explique ce qu'il advient de vos données lorsque vous l'utilisez.",
    "h-data-title": "Ce que ce site recueille",
    "h-data-body": "OhmZone n'a ni système de compte ni serveur backend. Les valeurs que vous saisissez dans un calculateur — tensions, sections de câble, puissances de transformateur, données de projet, etc. — sont traitées entièrement dans votre propre navigateur et ne sont jamais envoyées à, ni stockées sur, un serveur OhmZone. Si un outil offre une fonction « enregistrer le projet », ces données sont stockées uniquement dans le stockage local de votre navigateur, sur votre propre appareil; elles ne sont transmises nulle part. Nous n'exigeons ni ne recueillons de noms, adresses courriel ou informations de compte pour utiliser un calculateur de ce site.",
    "h-ads-title": "Publicité et témoins (cookies)",
    "h-ads-body": "Ce site utilise Google AdSense pour afficher de la publicité. Google et ses partenaires utilisent des témoins et technologies similaires pour diffuser des annonces basées sur vos visites antérieures à ce site et à d'autres. Cela peut inclure de la publicité personnalisée, selon vos paramètres.",
    "h-ads-li1": "Vous pouvez désactiver la publicité personnalisée en visitant les Paramètres des annonces Google à adssettings.google.com.",
    "h-ads-li2": "Vous pouvez aussi désactiver l'utilisation de témoins par un fournisseur tiers pour la publicité personnalisée en visitant www.aboutads.info.",
    "h-ads-li3": "L'utilisation de témoins publicitaires par Google lui permet, ainsi qu'à ses partenaires, de diffuser des annonces basées sur vos visites à ce site et/ou à d'autres sites Internet — voir la Confidentialité et les Conditions de Google à policies.google.com/technologies/ads pour plus de détails.",
    "h-children-title": "Confidentialité des enfants",
    "h-children-body": "Ce site est destiné à un usage professionnel et éducatif en génie et ne s'adresse pas aux enfants de moins de 13 ans. Nous ne recueillons pas sciemment de renseignements personnels auprès d'enfants.",
    "h-thirdparty-title": "Liens tiers",
    "h-thirdparty-body": "Lorsque ce site renvoie vers des fiches techniques de fabricants, des organismes de normalisation ou d'autres ressources externes, ces sites ont leurs propres pratiques de confidentialité, que nous ne contrôlons pas.",
    "h-changes-title": "Modifications de cette politique",
    "h-changes-body": "Cette politique peut être mise à jour périodiquement pour refléter des changements dans le fonctionnement du site ou dans les exigences applicables en matière de publicité/confidentialité. La date de « Dernière mise à jour » ci-dessus reflète la révision la plus récente.",
    "h-contact-title": "Contact",
    "h-contact-body": "Les questions concernant cette politique peuvent être adressées au propriétaire du site via les coordonnées fournies là où ce site est publié ou partagé."
  }
};
function setLang(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(translations[lang][key] !== undefined) el.innerHTML = translations[lang][key];
  });
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-fr').classList.toggle('active', lang==='fr');
  document.documentElement.lang = lang;
  try { localStorage.setItem('ohmzone-lang', lang); } catch(e) {}
}
(function(){
  let saved = 'en';
  try { saved = localStorage.getItem('ohmzone-lang') || 'en'; } catch(e) {}
  setLang(saved);
})();
</script>
<div style="position:fixed;bottom:6px;right:12px;font-family:monospace;font-size:10px;color:#5c7592;opacity:0.75;">© 2026 OhmZone. All rights reserved.</div>
</body>
</html>
